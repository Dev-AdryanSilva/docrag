# Tema da interface. Com [theme.light] e [theme.dark] definidos, o Streamlit segue o
# tema do sistema (prefers-color-scheme) e deixa trocar no menu ⋮ (System, Light, Dark).
# As mesmas cores aparecem como tokens em ui/styles.css. Contraste conferido (WCAG AA).

[theme]
font = "Public Sans:https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
baseRadius = "0.5rem"
showSidebarBorder = true
showWidgetBorder = true

[theme.light]
base = "light"
primaryColor = "#0E6B53"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F2"
textColor = "#1A1F1C"
linkColor = "#0E6B53"
borderColor = "#7D857F"
redTextColor = "#A1251D"
greenTextColor = "#0E6B53"

[theme.light.sidebar]
backgroundColor = "#F3F5F2"

[theme.dark]
base = "dark"
primaryColor = "#5FCCA3"
backgroundColor = "#111513"
secondaryBackgroundColor = "#1B211E"
textColor = "#E7ECE9"
linkColor = "#5FCCA3"
borderColor = "#7A847E"
redTextColor = "#FF9C92"
greenTextColor = "#5FCCA3"

[theme.dark.sidebar]
backgroundColor = "#1B211E"

[client]
# "viewer" esconde as opções de desenvolvedor, mas mantém o menu com a troca de tema
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
