name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # O índice extra traz o torch só para CPU (bem menor que a versão com CUDA),
      # igual ao Dockerfile.api
      - name: Instalar dependências
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt

      # Os testes simulam o Gemini, o Chroma e o Postgres: não precisam de segredos
      - name: Rodar os testes
        run: pytest -v
