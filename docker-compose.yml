services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Só considera o banco "pronto" quando ele aceita conexões
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Exposto para rodar a API direto no Windows durante o desenvolvimento
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      # Dentro da rede do compose, o host do banco é o nome do serviço: "postgres"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CHROMA_DIR: /data/chroma
    volumes:
      # Chroma persistido e cache do modelo de embeddings (evita baixar de novo)
      - chroma_data:/data/chroma
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      # A UI fala com a API pelo nome do serviço dentro da rede do compose
      API_URL: http://api:8000
      API_KEY: ${API_KEY}
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  postgres_data:
  chroma_data:
  hf_cache:
